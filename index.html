<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dnyaneshwari | React Profile Card</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'blob': 'blob 8s infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* 2026 Modern Glassmorphism Styling */
    .glass-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .dark .glass-pill {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 transition-colors duration-500 flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- React Mount Point -->
  <div id="root" class="w-full max-w-md"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- REUSABLE SVG ICONS (Native React - fast and zero DOM issues) ---
    const IconSun = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    );

    const IconMoon = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    );

    const IconHeart = ({ className, filled }) => (
      <svg className={className} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    );

    const IconCheck = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const IconGithub = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>
      </svg>
    );

    const IconLinkedin = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>
      </svg>
    );

    const IconTwitter = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    );

    const IconMail = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    );

    const IconShare = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
      </svg>
    );

    /**
     * =========================================================================
     * REACT CONCEPT 1: PROPS (Inputs passed INTO the component)
     * =========================================================================
     * Props are parameters passed to the ProfileCard component from its parent.
     * They make this component completely reusable for anyone:
     * - name, role, bio, skills, avatar, socialLinks
     */
    function ProfileCard({ name, role, bio, skills, avatar, socialLinks }) {

      /**
       * =======================================================================
       * REACT CONCEPT 2: STATE (Data that CHANGES over time)
       * =======================================================================
       * State represents the internal memory of this component:
       * 1. isDark (boolean): Controls dark/light mode toggle
       * 2. likes (number): Bonus (+10 XP) Interactive Like/Endorse counter
       * 3. isLiked (boolean): Tracks if the current visitor has liked
       * 4. copied (boolean): Shows "Copied!" feedback when link is clicked
       */
      const [isDark, setIsDark] = useState(true);
      const [likes, setLikes] = useState(128);
      const [isLiked, setIsLiked] = useState(false);
      const [copied, setCopied] = useState(false);

      // Synchronize full page dark class
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      // Bonus Feature (+10 XP): Interactive like counter function
      const handleLike = () => {
        if (!isLiked) {
          setLikes(prev => prev + 1);
          setIsLiked(true);
        } else {
          setLikes(prev => prev - 1);
          setIsLiked(false);
        }
      };

      // Interactive copy feedback
      const handleCopy = () => {
        navigator.clipboard.writeText(window.location.href);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="relative group">
          {/* Ambient Glowing Gradient Orbs */}
          <div className="absolute -top-12 -left-12 w-64 h-64 bg-indigo-500/30 rounded-full blur-3xl animate-blob"></div>
          <div className="absolute -bottom-12 -right-12 w-64 h-64 bg-purple-500/30 rounded-full blur-3xl animate-blob [animation-delay:2s]"></div>
          <div className="absolute top-1/2 left-1/4 w-48 h-48 bg-pink-500/20 rounded-full blur-2xl animate-blob [animation-delay:4s]"></div>

          {/* Main Glassmorphism Card */}
          <div className="glass-card rounded-3xl p-6 md:p-8 relative overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
            
            {/* Top Bar: Status Badge + Dark Mode Toggle (useState) */}
            <div className="flex items-center justify-between mb-6">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold glass-pill text-emerald-600 dark:text-emerald-400 shadow-sm">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>Available for Internships</span>
              </div>

              {/* Theme Toggle Button */}
              <button
                onClick={() => setIsDark(!isDark)}
                title="Toggle Dark/Light Mode"
                className="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-slate-700 dark:text-slate-200 hover:scale-110 active:scale-95 transition-transform duration-200 shadow-sm"
              >
                {isDark ? (
                  <IconSun className="w-5 h-5 text-amber-400" />
                ) : (
                  <IconMoon className="w-5 h-5 text-indigo-600" />
                )}
              </button>
            </div>

            {/* Profile Avatar & Header */}
            <div className="flex flex-col items-center text-center">
              <div className="relative mb-4">
                <div className="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 shadow-xl">
                  <img
                    src={avatar}
                    alt={name}
                    className="w-full h-full object-cover rounded-full bg-slate-200 dark:bg-slate-800"
                    onError={(e) => {
                      e.target.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80";
                    }}
                  />
                </div>
                {/* Verified Badge */}
                <div className="absolute bottom-1 right-1 w-7 h-7 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-md border-2 border-white dark:border-slate-900">
                  <IconCheck className="w-4 h-4" />
                </div>
              </div>

              {/* Props: name & role */}
              <h1 className="text-2xl font-extrabold text-slate-800 dark:text-white tracking-tight">
                {name}
              </h1>
              <p className="text-sm font-semibold text-indigo-600 dark:text-indigo-400 mt-1">
                {role}
              </p>

              {/* Props: bio */}
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-3 leading-relaxed max-w-sm">
                {bio}
              </p>
            </div>

            {/* Skills Badges (Props Array) */}
            <div className="mt-6">
              <h2 className="text-xs font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase mb-3 text-center">
                Skills & Tech Stack
              </h2>
              <div className="flex flex-wrap justify-center gap-2">
                {skills.map((skill, index) => (
                  <span
                    key={index}
                    className="px-3 py-1 rounded-xl text-xs font-medium glass-pill text-slate-700 dark:text-slate-200 hover:border-indigo-400/50 hover:text-indigo-500 transition-colors shadow-sm"
                  >
                    {skill}
                  </span>
                ))}
              </div>
            </div>

            {/* Stats Bar & Bonus Interactive Counter (+10 XP) */}
            <div className="mt-6 pt-5 border-t border-slate-200/50 dark:border-slate-800/80 flex items-center justify-around text-center">
              <div>
                <span className="block text-lg font-bold text-slate-800 dark:text-white">2+</span>
                <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">Projects</span>
              </div>
              
              <div className="h-8 w-px bg-slate-200 dark:bg-slate-800"></div>

              {/* Bonus Interactive Like / Endorse Counter Button */}
              <button
                onClick={handleLike}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-xl transition-all duration-200 active:scale-95 ${
                  isLiked
                    ? 'bg-rose-500/10 text-rose-500 border border-rose-500/30'
                    : 'glass-pill text-slate-600 dark:text-slate-300 hover:text-rose-500'
                }`}
                title="Click to Endorse / Like (+10 XP Interactive Feature)"
              >
                <IconHeart
                  className={`w-4 h-4 transition-transform duration-200 ${
                    isLiked ? 'scale-110 text-rose-500' : ''
                  }`}
                  filled={isLiked}
                />
                <span className="text-sm font-semibold">{likes}</span>
              </button>

              <div className="h-8 w-px bg-slate-200 dark:bg-slate-800"></div>

              <div>
                <span className="block text-lg font-bold text-slate-800 dark:text-white">ApnoAI</span>
                <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">Intern</span>
              </div>
            </div>

            {/* Social Media Links (Props Object) */}
            <div className="mt-6 flex items-center justify-center gap-3">
              {socialLinks.github && (
                <a
                  href={socialLinks.github}
                  target="_blank"
                  rel="noreferrer"
                  className="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-transform shadow-sm"
                  title="GitHub"
                >
                  <IconGithub className="w-5 h-5" />
                </a>
              )}
              {socialLinks.linkedin && (
                <a
                  href={socialLinks.linkedin}
                  target="_blank"
                  rel="noreferrer"
                  className="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-transform shadow-sm"
                  title="LinkedIn"
                >
                  <IconLinkedin className="w-5 h-5" />
                </a>
              )}
              {socialLinks.twitter && (
                <a
                  href={socialLinks.twitter}
                  target="_blank"
                  rel="noreferrer"
                  className="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-transform shadow-sm"
                  title="Twitter / X"
                >
                  <IconTwitter className="w-4 h-4" />
                </a>
              )}
              {socialLinks.email && (
                <a
                  href={`mailto:${socialLinks.email}`}
                  className="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-transform shadow-sm"
                  title="Email"
                >
                  <IconMail className="w-5 h-5" />
                </a>
              )}
            </div>

            {/* Action Buttons: Connect / Share */}
            <div className="mt-6 pt-2">
              <button
                onClick={handleCopy}
                className="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 active:scale-98 transition-all duration-200"
              >
                {copied ? <IconCheck className="w-4 h-4" /> : <IconShare className="w-4 h-4" />}
                <span>{copied ? "Link Copied to Clipboard!" : "Connect / Share Profile"}</span>
              </button>
            </div>

            {/* Subtitle / Footer Note */}
            <p className="text-[11px] text-center text-slate-400 dark:text-slate-500 mt-4 font-medium">
              Built with React 18 & Glassmorphism • ApnoAI Task 2
            </p>
          </div>
        </div>
      );
    }

    /**
     * =========================================================================
     * APP COMPONENT: Passing Props into ProfileCard
     * =========================================================================
     */
    function App() {
      // Data passed as PROPS
      const profileData = {
        name: "Dnyaneshwari",
        role: "Web Development Intern at ApnoAI",
        bio: "Passionate about building responsive, modern user interfaces with React and Tailwind CSS. Eager to create elegant digital experiences.",
        skills: ["React 18", "JavaScript", "Tailwind CSS", "HTML5/CSS3", "Python", "Git"],
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80",
        socialLinks: {
          github: "https://github.com",
          linkedin: "https://linkedin.com",
          twitter: "https://twitter.com",
          email: "dnyaneshwari@example.com"
        }
      };

      return (
        <div className="w-full flex justify-center py-8">
          <ProfileCard
            name={profileData.name}
            role={profileData.role}
            bio={profileData.bio}
            skills={profileData.skills}
            avatar={profileData.avatar}
            socialLinks={profileData.socialLinks}
          />
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
